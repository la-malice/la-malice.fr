name: Spike sources (simulation)
on:
  workflow_dispatch:
    inputs:
      tester_ia:
        description: 'Essai API payant sur fixture locale'
        type: boolean
        default: false
      tester_linktree:
        description: 'Lecture ponctuelle du Linktree public et extraction IA'
        type: boolean
        default: false
      tester_navigateur:
        description: 'Diagnostic ponctuel Instagram et Linktree sans authentification'
        type: boolean
        default: false
  schedule:
    - cron: '17 6,14,22 * * *'
permissions:
  contents: read
jobs:
  diagnostic-navigateur:
    if: github.event_name == 'workflow_dispatch' && inputs.tester_navigateur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire le profil Instagram public avec Chrome
        run: |
          mkdir -p diagnostic
          python3 prototype-sources/diagnostic_navigateur.py diagnostic/instagram.json
      - name: Diagnostiquer la réponse HTTP Linktree
        if: always()
        run: |
          mkdir -p diagnostic
          python3 prototype-sources/diagnostic_linktree.py diagnostic/linktree.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-sources-publics
          path: diagnostic/
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer la démonstration
        run: |
          python3 prototype-sources/demo.py resultat
          python3 -m unittest discover -s prototype-sources -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: spike-sources-simulees
          path: resultat/
  essai-ia:
    if: github.event_name == 'workflow_dispatch' && (inputs.tester_ia || inputs.tester_linktree)
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les données locales
        run: mkdir -p resultat-ia
      - name: Lire le Linktree public une fois
        if: inputs.tester_linktree
        run: python3 prototype-sources/linktree.py resultat-ia/linktree-source.json
      - name: Essai IA facultatif sur fixture
        if: inputs.tester_ia && !inputs.tester_linktree
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python3 prototype-sources/ia_spectacles.py prototype-sources/fixtures/spectacles.json resultat-ia/spectacles-ia.json
      - name: Essai IA sur les liens récupérés
        if: inputs.tester_linktree
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python3 prototype-sources/ia_spectacles.py resultat-ia/linktree-source.json resultat-ia/spectacles-ia.json
      - uses: actions/upload-artifact@v4
        with:
          name: spike-extraction-ia
          path: resultat-ia/
